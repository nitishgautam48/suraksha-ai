global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: suraksha-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
    # If METRICS_TOKEN is set, uncomment and put the token in deploy/prometheus/metrics_token:
    # authorization:
    #   credentials_file: /etc/prometheus/metrics_token
