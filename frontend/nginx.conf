# Suraksha AI web app: static files + same-origin proxy to the API (no CORS needed).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 30m;

    # Low-bandwidth friendly: compress text assets (~4x smaller on 2G/3G connections).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(self), microphone=(self)" always;
    # 'unsafe-eval' is required by the prototype runtime (support.js), which evaluates the page logic.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; media-src 'self' blob: data:; base-uri 'self'; form-action 'self'" always;

    # Metrics stay internal even though the API is proxied.
    location = /api/metrics { return 404; }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /config.js { expires -1; }
    location = /favicon.ico { access_log off; log_not_found off; return 204; }
    location /vendor/ { expires 30d; }
    location /i18n/ { expires 7d; }

    # Email links (/verify-email, /reset-password) and any other path load the app.
    location / { try_files $uri $uri/ /index.html; }
}
